name: link-check

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 UTC 02:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe every endpoint
        id: probe
        continue-on-error: true
        run: python scripts/check_links.py
      - name: Open or update the link-check issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/link-check.md', 'utf8');
            const title = '链接体检：有入口不通';
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const hit = open.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: hit.number,
                body: '## 新一轮体检\n\n' + body
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Turn the badge red
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::有入口不通，详见 issue"
          exit 1
